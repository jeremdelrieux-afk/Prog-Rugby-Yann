<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programme Rugby TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f4;
    --card: #ffffff;
    --ink: #14181f;
    --muted: #6b7280;
    --border: #e4e7ec;
    --accent: #1a7a4c;
    --accent-dark: #0e3d27;
    --amber: #f0a63a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Manrope", "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    padding: 26px 20px;
    text-align: center;
    background: var(--accent-dark);
    color: #fff;
  }
  header h1 {
    margin: 0 0 4px 0;
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: -0.3px;
  }
  header p {
    margin: 0;
    font-size: 1.15rem;
    color: #b9d1c4;
    font-weight: 500;
  }

  .rolling-ball {
    position: fixed;
    top: 12px;
    left: -60px;
    width: 40px;
    height: 40px;
    z-index: 50;
    opacity: 0;
    animation: roll-across 14s linear infinite;
    animation-fill-mode: backwards;
    pointer-events: none;
  }
  .rolling-ball svg { width: 100%; height: 100%; animation: spin 0.7s linear infinite; }
  @keyframes roll-across {
    0%   { left: -60px; opacity: 0; }
    3%   { opacity: 1; }
    35%  { left: calc(100% - 40px); opacity: 1; }
    38%  { opacity: 0; }
    100% { left: calc(100% - 40px); opacity: 0; }
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .rolling-ball { display: none; } }

  .running-player {
    position: fixed;
    top: 80px;
    left: -80px;
    width: 64px;
    height: 64px;
    z-index: 49;
    opacity: 0;
    animation: run-across 18s linear infinite;
    animation-delay: 6s;
    animation-fill-mode: backwards;
    pointer-events: none;
  }
  .running-player svg { width: 100%; height: 100%; }
  .running-player .runner-legs { animation: run-legs 0.35s steps(2) infinite; transform-origin: 32px 50px; }
  .speech-bubble {
    position: absolute;
    top: -34px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #14181f;
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 5px 10px;
    border-radius: 8px;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .speech-bubble::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 6px 6px 0 6px;
    border-style: solid;
    border-color: #fff transparent transparent transparent;
  }
  @keyframes run-across {
    0%   { left: -80px; opacity: 0; }
    4%   { opacity: 1; }
    45%  { left: calc(100% - 40px); opacity: 1; }
    48%  { opacity: 0; }
    100% { left: calc(100% - 40px); opacity: 0; }
  }
  @keyframes run-legs {
    0%, 100% { transform: skewX(6deg); }
    50% { transform: skewX(-6deg); }
  }
  @media (prefers-reduced-motion: reduce) { .running-player { display: none; } }

  .running-player.player-2 {
    top: 130px;
    animation-delay: 15s;
  }

  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }

  .next-match-card {
    background: linear-gradient(135deg, #8c1c2e, #5c1220);
    color: #ffffff;
    border-radius: 16px;
    padding: 22px 26px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    margin-bottom: 20px;
  }
  .next-match-illu { flex: 0 0 auto; width: 60px; height: 60px; }
  .next-match-illu svg { width: 100%; height: 100%; }
  .next-match-greeting { margin: 0 0 4px 0; font-weight: 700; font-size: 1.2rem; }
  .next-match-detail { margin: 0 0 6px 0; font-weight: 800; font-size: 1.5rem; line-height: 1.3; }
  .next-match-warning { margin: 0; font-weight: 600; font-style: italic; font-size: 1.15rem; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .filter-chip {
    font-family: "Manrope", sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 999px;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .filter-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .refresh-btn {
    display: block;
    width: 100%;
    margin: 0 0 24px 0;
    padding: 16px;
    font-family: "Manrope", sans-serif;
    font-size: 1.25rem;
    font-weight: 800;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  .refresh-btn:active { opacity: 0.85; }
  .refresh-btn:disabled { opacity: 0.6; cursor: wait; }
  #lastUpdate {
    text-align: center;
    font-size: 1rem;
    color: var(--muted);
    margin: -16px 0 20px;
  }

  .day-title {
    font-weight: 800;
    font-size: 1.3rem;
    margin: 26px 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 3px solid var(--accent);
  }

  .match-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(16,24,40,0.06);
    margin-bottom: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .comp-logo {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: #f2f4f7;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .comp-logo img { width: 100%; height: 100%; object-fit: contain; }
  .comp-logo.fallback {
    color: #fff;
    font-weight: 800;
    font-size: 0.8rem;
  }

  .teams-block { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .teams-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .team-crest { width: 32px; height: 32px; object-fit: contain; flex: 0 0 auto; }
  .team-name { font-weight: 700; font-size: 1.25rem; }
  .vs-sep { color: var(--muted); font-weight: 600; }
  .comp-label { font-size: 0.98rem; color: var(--muted); font-weight: 600; }

  .when-block {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .time-pill {
    font-weight: 800;
    font-size: 1.25rem;
    color: var(--accent-dark);
    background: #eaf3ee;
    padding: 6px 14px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .chan-badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .chan-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #f2f4f7;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--ink);
  }
  .chan-badge img { height: 34px; width: auto; display: block; }
  .chan-badge.no-logo { background: #333; color: #fff; }

  @media (max-width: 560px) {
    .match-row { flex-wrap: wrap; }
    .when-block { flex: 1 1 100%; align-items: flex-start; flex-direction: row; justify-content: space-between; margin-top: 6px; }
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 16px 16px 0;
    max-width: 900px;
    margin: 0 auto;
  }
  .tab-btn {
    flex: 1;
    max-width: 260px;
    font-family: "Manrope", sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    padding: 14px;
    border-radius: 12px 12px 0 0;
    border: none;
    background: #dfe3e8;
    color: var(--muted);
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--card);
    color: var(--accent-dark);
  }

  .films-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .film-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(16,24,40,0.08);
    cursor: pointer;
  }
  .film-poster-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    background: #dfe3e8;
    overflow: hidden;
  }
  .film-poster-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .film-poster-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
  }
  .film-time-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(14,61,39,0.9);
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    padding: 4px 10px;
    border-radius: 8px;
  }
  .film-chan-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(255,255,255,0.92);
    color: var(--accent-dark);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 4px 8px;
    border-radius: 8px;
    max-width: 70%;
    text-align: right;
  }
  .film-info {
    padding: 10px 12px;
  }
  .film-title { font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
  .film-genre { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }

  .film-overlay {
    position: absolute;
    inset: 0;
    background: rgba(14,61,39,0.96);
    color: #fff;
    padding: 14px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    overflow-y: auto;
  }
  .film-card.revealed .film-overlay {
    opacity: 1;
    pointer-events: auto;
  }
  @media (hover: hover) and (pointer: fine) {
    .film-card:hover .film-overlay {
      opacity: 1;
      pointer-events: auto;
    }
  }
  .film-overlay-title { font-weight: 800; font-size: 1.1rem; margin-bottom: 6px; }
  .film-overlay-meta { font-size: 0.85rem; color: #cfe0d6; margin-bottom: 8px; }
  .film-overlay-synopsis { font-size: 0.92rem; line-height: 1.45; }

  #status {
    text-align: center;
    font-size: 1.4rem;
    padding: 40px 20px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="rolling-ball" id="rollingBall"></div>
<div class="running-player" id="runningPlayer"></div>
<div class="running-player player-2" id="runningPlayer2"></div>

<header>
  <h1>🏉🎬 Programme TV</h1>
  <p>Rugby et films, toutes chaînes confondues</p>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabBtnRugby">🏉 Rugby</button>
  <button class="tab-btn" id="tabBtnFilms">🎬 Films</button>
</div>

<main>
  <div id="rugbyTab">
    <div id="nextMatchBanner"></div>
    <div class="filters" id="filters"></div>
    <button class="refresh-btn" id="refreshBtn">Actualiser les matchs</button>
    <div id="lastUpdate"></div>
    <div id="status">Chargement des matchs…</div>
    <div id="content"></div>
  </div>

  <div id="filmsTab" style="display:none;">
    <button class="refresh-btn" id="refreshBtnFilms">Actualiser les films</button>
    <div id="lastUpdateFilms"></div>
    <div id="statusFilms">Chargement des films…</div>
    <div id="contentFilms"></div>
  </div>
</main>

<script>
  const WORKER_URL = "https://rugbytv.jeremdelrieux.workers.dev/";
  const WORKER_FILMS_URL = "https://filmstv.jeremdelrieux.workers.dev/";

  let filmsLoaded = false;

  const statusEl = document.getElementById("status");
  const contentEl = document.getElementById("content");
  const refreshBtn = document.getElementById("refreshBtn");
  const lastUpdateEl = document.getElementById("lastUpdate");
  const nextMatchBanner = document.getElementById("nextMatchBanner");
  const filtersEl = document.getElementById("filters");

  let allMatches = [];
  let activeFilter = "Toutes";

  const RUGBY_BALL_SVG = `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="50" rx="46" ry="30" fill="#5a3820" stroke="#2f1c0f" stroke-width="3" transform="rotate(-20 50 50)"/>
      <g transform="rotate(-20 50 50)" stroke="#f2e9dd" stroke-width="2.5" fill="none">
        <line x1="10" y1="50" x2="90" y2="50"/>
        <line x1="30" y1="42" x2="30" y2="58"/>
        <line x1="45" y1="40" x2="45" y2="60"/>
        <line x1="60" y1="40" x2="60" y2="60"/>
        <line x1="75" y1="42" x2="75" y2="58"/>
      </g>
    </svg>`;

  const RUNNER_SVG = `
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="20" cy="30" rx="7" ry="4.5" fill="#5a3820" stroke="#2f1c0f" stroke-width="1.5" transform="rotate(-15 20 30)"/>
      <circle cx="34" cy="14" r="6" fill="#e8b088"/>
      <path d="M28.5 9.5 Q34 5.5 39.5 9.5 Q39.5 12 38 13.5 Q34 10.5 30 13.5 Q28.5 12 28.5 9.5 Z" fill="#3a2417"/>
      <path d="M28 22 Q34 18 40 23 L38 34 Q34 30 30 34 Z" fill="#1a7a4c"/>
      <g class="runner-legs">
        <path d="M30 33 L26 40 L30 41 L34 34 Z" fill="#e8b088"/>
        <path d="M35 33 L40 39 L36 41 L32 34 Z" fill="#e8b088"/>
        <path d="M28 44 L24 48 L28 50 L31 45 Z" fill="#14181f"/>
        <path d="M37 43 L42 46 L38 49 L34 45 Z" fill="#14181f"/>
        <path d="M27 31 Q34 27 41 32 L39 38 Q34 34 29 38 Z" fill="#ffffff"/>
      </g>
      <path d="M28 24 L18 28" stroke="#e8b088" stroke-width="4" stroke-linecap="round"/>
      <path d="M39 25 L46 20" stroke="#e8b088" stroke-width="4" stroke-linecap="round"/>
    </svg>`;

  const RUNNER_GIRL_SVG = `
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="20" cy="30" rx="7" ry="4.5" fill="#5a3820" stroke="#2f1c0f" stroke-width="1.5" transform="rotate(-15 20 30)"/>
      <path d="M40 12 Q44 16 41 22 L37 20 Q39 15 37 11 Z" fill="#e8c468"/>
      <circle cx="34" cy="14" r="6" fill="#e8b088"/>
      <path d="M28.5 9.5 Q34 5 39.5 9.5 Q39.5 11.5 38.5 12.5 Q34 9.5 29.5 12.5 Q28.5 11.5 28.5 9.5 Z" fill="#e8c468"/>
      <path d="M28 22 Q34 18 40 23 L38 34 Q34 30 30 34 Z" fill="#c0447a"/>
      <g class="runner-legs">
        <path d="M30 33 L26 40 L30 41 L34 34 Z" fill="#e8b088"/>
        <path d="M35 33 L40 39 L36 41 L32 34 Z" fill="#e8b088"/>
        <path d="M28 44 L24 48 L28 50 L31 45 Z" fill="#14181f"/>
        <path d="M37 43 L42 46 L38 49 L34 45 Z" fill="#14181f"/>
        <path d="M27 31 Q34 27 41 32 L39 38 Q34 34 29 38 Z" fill="#ffffff"/>
      </g>
      <path d="M28 24 L18 28" stroke="#e8b088" stroke-width="4" stroke-linecap="round"/>
      <path d="M39 25 L46 20" stroke="#e8b088" stroke-width="4" stroke-linecap="round"/>
    </svg>`;

  function compInitials(comp) {
    const map = {
      "Top 14": "T14", "Pro D2": "D2", "Champions Cup": "CC", "Challenge Cup": "CH",
      "Six Nations": "6N", "Coupe du Monde": "CM", "Nations Championship": "NC",
      "NRL": "NRL", "Test Match": "TM", "Rugby Féminin": "FEM", "Feminines": "FEM",
    };
    return map[comp] || comp.slice(0, 3).toUpperCase();
  }

  function compColor(comp) {
    const colors = {
      "Top 14": "#f0a63a", "Pro D2": "#4a9d7f", "Champions Cup": "#8b5cf6",
      "Challenge Cup": "#ec8ba0", "Six Nations": "#e2001a", "Coupe du Monde": "#1e6fd9",
      "Nations Championship": "#2fb8a6", "NRL": "#00a651", "Test Match": "#c0392b",
      "Rugby Féminin": "#d63384", "Feminines": "#d63384",
    };
    return colors[comp] || "#f0a63a";
  }

  function compLogoHtml(m) {
    const color = compColor(m.competition);
    const initials = compInitials(m.competition);
    if (m.competitionLogo) {
      return `<div class="comp-logo">
        <img src="${m.competitionLogo}" alt="${escapeHtml(m.competition)}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="comp-logo fallback" style="background:${color}; display:none;">${initials}</div>
      </div>`;
    }
    return `<div class="comp-logo fallback" style="background:${color}">${initials}</div>`;
  }

  function teamCrestHtml(name, logo) {
    if (!logo) return "";
    return `<img class="team-crest" src="${logo}" alt="${escapeHtml(name)}" loading="lazy" onerror="this.remove()">`;
  }

  function chanBadgeHtml(c) {
    if (c.logo) {
      return `<span class="chan-badge">
        <img src="${c.logo}" alt="${escapeHtml(c.nom)}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
        <span style="display:none;">${escapeHtml(c.nom)}</span>
      </span>`;
    }
    return `<span class="chan-badge no-logo">${escapeHtml(c.nom)}</span>`;
  }

  function simplifyChannels(chaines) {
    const specificVariants = ["Canal+ Live", "Canal+ Sport", "Canal+ Foot"];
    const hasSpecific = chaines.some(c => specificVariants.includes(c.nom));
    if (hasSpecific) {
      return chaines.filter(c => c.nom !== "Canal+");
    }
    return chaines;
  }

  function renderNextMatchBanner(matches) {
    if (!matches || matches.length === 0) { nextMatchBanner.innerHTML = ""; return; }
    const next = matches[0];
    const chaines = simplifyChannels(next.chaines).map(c => c.nom).join(" / ");
    nextMatchBanner.innerHTML = `
      <div class="next-match-card">
        <div class="next-match-illu">${RUGBY_BALL_SVG}</div>
        <div>
          <p class="next-match-greeting">Bonjour Yannik 👋</p>
          <p class="next-match-detail">Prochain match : ${escapeHtml(next.equipeA)} — ${escapeHtml(next.equipeB)}, ${escapeHtml(next.jour).toLowerCase()} à ${escapeHtml(next.heure || "?")} sur ${escapeHtml(chaines)}</p>
          <p class="next-match-warning">Ne le loupe pas !</p>
        </div>
      </div>`;
  }

  async function loadMatches() {
    statusEl.style.display = "block";
    statusEl.textContent = "Chargement des matchs…";
    contentEl.innerHTML = "";
    refreshBtn.disabled = true;

    try {
      const res = await fetch(WORKER_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("Réponse serveur invalide");
      const data = await res.json();

      if (!data.matches || data.matches.length === 0) {
        statusEl.textContent = "Aucun match trouvé pour le moment.";
        nextMatchBanner.innerHTML = "";
        filtersEl.innerHTML = "";
        return;
      }

      allMatches = data.matches;
      renderFilters();
      renderMatchList();
      statusEl.style.display = "none";

      const now = new Date();
      lastUpdateEl.textContent = "Dernière mise à jour : " + now.toLocaleString("fr-FR");
    } catch (err) {
      statusEl.textContent = "⚠️ Impossible de charger les matchs pour le moment. Réessaie dans quelques minutes.";
      console.error(err);
    } finally {
      refreshBtn.disabled = false;
    }
  }

  function renderFilters() {
    const comps = ["Toutes", ...new Set(allMatches.map(m => m.competition))];
    if (!comps.includes(activeFilter)) activeFilter = "Toutes";
    filtersEl.innerHTML = comps.map(c =>
      `<button class="filter-chip${c === activeFilter ? " active" : ""}" data-comp="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join("");
    filtersEl.querySelectorAll(".filter-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.comp;
        renderFilters();
        renderMatchList();
      });
    });
  }

  const MOIS_FR = {
    "janvier": 0, "février": 1, "mars": 2, "avril": 3, "mai": 4, "juin": 5,
    "juillet": 6, "août": 7, "septembre": 8, "octobre": 9, "novembre": 10, "décembre": 11,
  };

  function dayLabelToDate(label) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    if (label === "Aujourd'hui") return today;
    if (label === "Demain") {
      const d = new Date(today);
      d.setDate(d.getDate() + 1);
      return d;
    }
    // Ex: "Samedi 26 Septembre" ou "Vendredi 08 Janvier 2027"
    const m = label.match(/(\d{1,2})\s+([a-zéû]+)(?:\s+(\d{4}))?/i);
    if (!m) return new Date(8640000000000000); // inconnu -> tout à la fin
    const jourNum = parseInt(m[1], 10);
    const moisIdx = MOIS_FR[m[2].toLowerCase()];
    if (moisIdx === undefined) return new Date(8640000000000000);
    let annee = m[3] ? parseInt(m[3], 10) : today.getFullYear();
    const d = new Date(annee, moisIdx, jourNum);
    // Sans année explicite : si la date tombe très loin dans le passé, c'est l'année prochaine
    if (!m[3] && d < today) {
      const diffDays = (today - d) / 86400000;
      if (diffDays > 30) d.setFullYear(annee + 1);
    }
    return d;
  }

  function sortedDayEntries(groups) {
    return [...groups.entries()].sort((a, b) => dayLabelToDate(a[0]) - dayLabelToDate(b[0]));
  }

  function pickUpcoming(groups) {
    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    for (const [jour, matchs] of sortedDayEntries(groups)) {
      for (const m of matchs) {
        if (jour === "Aujourd'hui" && m.heure) {
          const [hh, mm] = m.heure.split("h").map(Number);
          const matchMinutes = hh * 60 + (mm || 0);
          if (matchMinutes <= nowMinutes) continue;
        }
        return [m];
      }
    }
    return [];
  }

  function renderMatchList() {
    const filtered = activeFilter === "Toutes"
      ? allMatches
      : allMatches.filter(m => m.competition === activeFilter);

    if (filtered.length === 0) {
      contentEl.innerHTML = "";
      nextMatchBanner.innerHTML = "";
      statusEl.style.display = "block";
      statusEl.textContent = "Aucun match pour cette compétition.";
      return;
    }
    statusEl.style.display = "none";

    const groups = new Map();
    for (const m of filtered) {
      if (!groups.has(m.jour)) groups.set(m.jour, []);
      groups.get(m.jour).push(m);
    }
    for (const matchs of groups.values()) {
      matchs.sort((a, b) => {
        const toMinutes = (h) => {
          if (!h) return 9999;
          const [hh, mm] = h.split("h").map(Number);
          return hh * 60 + (mm || 0);
        };
        return toMinutes(a.heure) - toMinutes(b.heure);
      });
    }

    renderNextMatchBanner(pickUpcoming(groups));

    let html = "";
    for (const [jour, matchs] of sortedDayEntries(groups)) {
      html += `<div class="day-title">${escapeHtml(jour)}</div>`;
      for (const m of matchs) {
        html += `
          <div class="match-row">
            ${compLogoHtml(m)}
            <div class="teams-block">
              <div class="teams-line">
                ${teamCrestHtml(m.equipeA, m.equipeALogo)}
                <span class="team-name">${escapeHtml(m.equipeA)}</span>
                <span class="vs-sep">—</span>
                ${teamCrestHtml(m.equipeB, m.equipeBLogo)}
                <span class="team-name">${escapeHtml(m.equipeB)}</span>
              </div>
              <div class="comp-label">${escapeHtml(m.competition)}</div>
            </div>
            <div class="when-block">
              <div class="time-pill">${m.heure ? escapeHtml(m.heure) : "—"}</div>
              <div class="chan-badges">
                ${simplifyChannels(m.chaines).map(c => chanBadgeHtml(c)).join("")}
              </div>
            </div>
          </div>`;
      }
    }
    contentEl.innerHTML = html;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  document.getElementById("rollingBall").innerHTML = RUGBY_BALL_SVG;
  document.getElementById("runningPlayer").innerHTML = `<div class="speech-bubble">Bonjour Yann 👋</div>${RUNNER_SVG}`;
  document.getElementById("runningPlayer2").innerHTML = `<div class="speech-bubble">N'oublie pas de t'hydrater 💧</div>${RUNNER_GIRL_SVG}`;

  // ------ Onglets ------
  const tabBtnRugby = document.getElementById("tabBtnRugby");
  const tabBtnFilms = document.getElementById("tabBtnFilms");
  const rugbyTab = document.getElementById("rugbyTab");
  const filmsTab = document.getElementById("filmsTab");

  tabBtnRugby.addEventListener("click", () => {
    tabBtnRugby.classList.add("active");
    tabBtnFilms.classList.remove("active");
    rugbyTab.style.display = "";
    filmsTab.style.display = "none";
  });
  tabBtnFilms.addEventListener("click", () => {
    tabBtnFilms.classList.add("active");
    tabBtnRugby.classList.remove("active");
    filmsTab.style.display = "";
    rugbyTab.style.display = "none";
    if (!filmsLoaded) loadFilms();
  });

  // ------ Films ------
  const statusFilmsEl = document.getElementById("statusFilms");
  const contentFilmsEl = document.getElementById("contentFilms");
  const refreshBtnFilms = document.getElementById("refreshBtnFilms");
  const lastUpdateFilmsEl = document.getElementById("lastUpdateFilms");

  async function loadFilms() {
    statusFilmsEl.style.display = "block";
    statusFilmsEl.textContent = "Chargement des films…";
    contentFilmsEl.innerHTML = "";
    refreshBtnFilms.disabled = true;

    try {
      const res = await fetch(WORKER_FILMS_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("Réponse serveur invalide");
      const data = await res.json();

      if (!data.films || data.films.length === 0) {
        statusFilmsEl.textContent = "Aucun film trouvé pour le moment.";
        return;
      }

      filmsLoaded = true;
      renderFilms(data.films);
      statusFilmsEl.style.display = "none";

      const now = new Date();
      lastUpdateFilmsEl.textContent = "Dernière mise à jour : " + now.toLocaleString("fr-FR");
    } catch (err) {
      statusFilmsEl.textContent = "⚠️ Impossible de charger les films pour le moment. Réessaie dans quelques minutes.";
      console.error(err);
    } finally {
      refreshBtnFilms.disabled = false;
    }
  }

  function renderFilms(films) {
    const groups = new Map();
    for (const f of films) {
      if (!groups.has(f.jour)) groups.set(f.jour, []);
      groups.get(f.jour).push(f);
    }
    for (const list of groups.values()) {
      list.sort((a, b) => {
        const toMinutes = (h) => {
          const [hh, mm] = h.split("h").map(Number);
          return hh * 60 + (mm || 0);
        };
        return toMinutes(a.heureDebut) - toMinutes(b.heureDebut);
      });
    }

    let html = "";
    for (const [jour, list] of groups) {
      html += `<div class="day-title">${escapeHtml(jour)}</div><div class="films-grid">`;
      for (const f of list) {
        const posterHtml = f.affiche
          ? `<img src="${f.affiche}" alt="${escapeHtml(f.titre)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;film-poster-fallback&quot;>🎬</div>';">`
          : `<div class="film-poster-fallback">🎬</div>`;
        html += `
          <div class="film-card" tabindex="0">
            <div class="film-poster-wrap">
              ${posterHtml}
              <div class="film-time-badge">${escapeHtml(f.heureDebut)}</div>
              <div class="film-chan-badge">${escapeHtml(f.chaine)}</div>
            </div>
            <div class="film-info">
              <div class="film-title">${escapeHtml(f.titre)}</div>
              <div class="film-genre">${escapeHtml(f.genreDuree || "")}</div>
            </div>
            <div class="film-overlay">
              <div class="film-overlay-title">${escapeHtml(f.titre)}</div>
              <div class="film-overlay-meta">${escapeHtml(f.chaine)} — ${escapeHtml(f.heureDebut)}${f.genreDuree ? " — " + escapeHtml(f.genreDuree) : ""}</div>
              <div class="film-overlay-synopsis">${f.synopsis ? escapeHtml(f.synopsis) + "…" : "Pas de résumé disponible."}</div>
            </div>
          </div>`;
      }
      html += `</div>`;
    }
    contentFilmsEl.innerHTML = html;

    // Sur mobile/tablette (pas de survol) : un tap sur la carte révèle le synopsis
    contentFilmsEl.querySelectorAll(".film-card").forEach((card) => {
      card.addEventListener("click", () => {
        const wasOpen = card.classList.contains("revealed");
        contentFilmsEl.querySelectorAll(".film-card.revealed").forEach((c) => c.classList.remove("revealed"));
        if (!wasOpen) card.classList.add("revealed");
      });
    });
  }

  refreshBtnFilms.addEventListener("click", loadFilms);

  refreshBtn.addEventListener("click", loadMatches);
  loadMatches();
</script>

</body>
</html>
